<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Ledger | Dessy Ackerman Archive Admin</title>
  <meta name="description" content="Private Owner Ledger and Content Management Studio for Dessy Ackerman's author website.">
  <meta name="robots" content="noindex, nofollow">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗝️</text></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Standalone Admin Page Layout */
    .admin-standalone-wrapper {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem 1rem;
      position: relative;
      z-index: 10;
    }
    
    .admin-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 0.9rem 1.5rem;
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-page);
      border: 1px solid rgba(139, 115, 85, 0.18);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .admin-brand h1 {
      font-size: 1.5rem;
      font-family: var(--font-heading);
      color: var(--color-ink);
      margin: 0;
    }
    .admin-brand-badge {
      background: var(--color-parchment-accent);
      border: 1px solid rgba(139, 115, 85, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-ink-faded);
    }

    .admin-top-links {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .admin-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 0.95rem;
      background-color: var(--color-parchment-accent);
      border: 1px solid rgba(139, 115, 85, 0.3);
      border-radius: 20px;
      color: var(--color-ink);
      text-decoration: none;
      font-family: var(--font-serif);
      font-size: 0.9rem;
      font-weight: 600;
      transition: var(--transition-smooth);
    }
    .admin-nav-link:hover {
      background-color: var(--color-parchment);
      border-color: var(--color-sage);
      transform: translateY(-1px);
    }
    .admin-lock-btn {
      padding: 0.45rem 1rem;
      background-color: var(--color-rose-light);
      border: 1px solid var(--color-rose);
      border-radius: 20px;
      color: var(--color-ink);
      font-family: var(--font-handwritten);
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition-smooth);
    }
    .admin-lock-btn:hover {
      background-color: var(--color-rose);
      color: #fff;
    }

    .admin-main-container {
      background-color: var(--color-parchment);
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-tactile);
      border: 1px solid rgba(139, 115, 85, 0.2);
      padding: 2rem;
      min-height: 500px;
    }

    @media (max-width: 600px) {
      .admin-main-container {
        padding: 1.2rem;
      }
      .admin-top-bar {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background wooden desk surface -->
  <div class="desk-surface" style="min-height: 100vh; padding: 1.5rem 1rem;">
    <div class="desk-glow"></div>

    <div class="admin-standalone-wrapper">
      
      <!-- Top Navigation Header -->
      <header class="admin-top-bar" id="admin-top-bar" style="display: none;">
        <div class="admin-brand">
          <span style="font-size: 1.4rem;">🗝️</span>
          <h1>Owner Ledger</h1>
          <span class="admin-brand-badge">Admin Studio</span>
        </div>

        <div class="admin-top-links">
          <a href="index.html" class="admin-nav-link">← Return to Website</a>
          <a href="index.html" target="_blank" rel="noopener" class="admin-nav-link">Open Live Site ↗</a>
          <button class="admin-lock-btn" id="header-lock-btn">Lock Ledger 🔒</button>
        </div>
      </header>

      <!-- Main Slot for Passcode Gate or Admin Dashboard -->
      <main class="admin-main-container" id="admin-slot">
        <div class="loading-placeholder">
          <span class="handwritten">Unlocking the archives...</span>
        </div>
      </main>

    </div>

    <!-- Toast Notification Container -->
    <div class="admin-toast-container" id="admin-toast-container"></div>

    <!-- Book Detail Modal (for previewing books directly in admin) -->
    <div class="modal-overlay" id="book-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-book-title">
      <div class="modal-container">
        <button class="modal-close" id="modal-close-btn" aria-label="Close Details">✕ Close</button>
        <div class="modal-content" id="modal-content-slot"></div>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
